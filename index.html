<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Region MLBB by ID</title>
<style>
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
  }
  .box {
    background: #1e293b;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    width: 90%;
    max-width: 400px;
    text-align: center;
  }
  h1 { color: #3b82f6; margin-bottom: 10px; }
  p { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
  input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border-radius: 8px;
    border: none;
    background: #334155;
    color: #fff;
    font-size: 16px;
    box-sizing: border-box;
  }
  button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background: #3b82f6;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
  }
  button:hover { background: #2563eb; }
  button:disabled { background: #475569; cursor: not-allowed; }
  .hasil {
    margin-top: 20px;
    padding: 15px;
    background: #0f172a;
    border-radius: 10px;
    display: none;
  }
  .loading { color: #fbbf24; }
  .error { color: #ef4444; }
  .success { color: #22c55e; }
</style>
</head>
<body>

<div class="box">
  <h1>🎮 Cek Region MLBB</h1>
  <p>Masukkan User ID + Zone ID untuk tahu region server</p>
  
  <input type="number" id="uid" placeholder="Contoh User ID: 123456789">
  <input type="number" id="zone" placeholder="Contoh Zone ID: 1234">
  
  <button id="btnCek" onclick="cekRegion()">CEK SEKARANG</button>

  <div id="hasilBox" class="hasil">
    <h3 id="status"></h3>
    <p><b>Nickname:</b> <span id="nick"></span></p>
    <p><b>Region:</b> <span id="region"></span></p>
    <p><b>ID:</b> <span id="idFull"></span></p>
  </div>
</div>

<script>
async function cekRegion() {
  const uid = document.getElementById('uid').value.trim();
  const zone = document.getElementById('zone').value.trim();
  const btn = document.getElementById('btnCek');
  const hasilBox = document.getElementById('hasilBox');

  if(!uid || !zone){
    alert("Isi User ID dan Zone ID dulu bang!");
    return;
  }

  btn.disabled = true;
  btn.innerText = "Loading...";
  hasilBox.style.display = "block";
  document.getElementById('status').className = "loading";
  document.getElementById('status').innerText = "Sedang cek...";

  try {
    // Guna API dazelpro
    const res = await fetch(`https://api.dazelpro.com/mobile-legends/player/${uid}/${zone}`);
    const data = await res.json();

    if(data.status && data.data){
      document.getElementById('status').className = "success";
      document.getElementById('status').innerText = "✅ Berjaya!";
      document.getElementById('nick').innerText = data.data.name;
      document.getElementById('region').innerText = data.data.region || "Tidak diketahui";
      document.getElementById('idFull').innerText = `${uid}(${zone})`;
    } else {
      throw new Error(data.message || "ID tidak dijumpai");
    }
  } catch(err) {
    document.getElementById('status').className = "error";
    document.getElementById('status').innerText = "❌ Gagal: " + err.message;
    document.getElementById('nick').innerText = "-";
    document.getElementById('region').innerText = "-";
    document.getElementById('idFull').innerText = "-";
  }

  btn.disabled = false;
  btn.innerText = "CEK SEKARANG";
}
</script>

</body>
</html>
